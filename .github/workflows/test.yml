name: Test Suite

on:
  push:
    branches: [main, mainline_compatibility]
  pull_request:
    branches: [main, mainline_compatibility]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ==========================================================================
  # UNIT TESTS - Fast, no external dependencies
  # Runs on every push/PR
  # ==========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short -m "not requires_openai and not requires_neo4j"
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          fail_ci_if_error: false

  # ==========================================================================
  # INTEGRATION TESTS - With database, may use LLM
  # Runs on PRs to mainline branches
  # ==========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'mainline_compatibility')
    
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx
      
      - name: Check for API key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::OPENAI_API_KEY not set, skipping LLM tests"
          fi
      
      - name: Run integration tests (without LLM)
        run: |
          pytest tests/integration/ -v --tb=short -m "not requires_openai and not requires_neo4j"
      
      - name: Run integration tests (with LLM)
        if: env.OPENAI_API_KEY != ''
        run: |
          pytest tests/integration/ -v --tb=short -m "requires_openai" --timeout=120
        continue-on-error: true

  # ==========================================================================
  # E2E QUERY TESTS - Full agent tests with real queries
  # Only runs on PRs to mainline_compatibility
  # ==========================================================================
  e2e-query-tests:
    name: E2E Query Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'pull_request' && github.base_ref == 'mainline_compatibility'
    
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout
      
      - name: Run critical query tests
        if: env.OPENAI_API_KEY != ''
        run: |
          # Run a subset of critical queries for CI
          pytest tests/e2e/test_queries.py -v --tb=short -k "gpu or cpu" --timeout=180
        continue-on-error: true
      
      - name: Generate query test report
        if: env.OPENAI_API_KEY != '' && always()
        run: |
          python -m tests.e2e.test_queries || true
      
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: query-test-report
          path: tests/query_test_report.json
          retention-days: 30

  # ==========================================================================
  # API TESTS - Test FastAPI endpoints
  # ==========================================================================
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      
      - name: Run API tests
        env:
          OPENAI_API_KEY: "test-key-for-api-structure-tests"
        run: |
          pytest tests/integration/test_api.py -v --tb=short -m "not requires_openai" || true

  # ==========================================================================
  # LINT AND TYPE CHECK
  # ==========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
      
      - name: Run Ruff linter
        run: |
          ruff check . --ignore E501,F401 || true
      
      - name: Run type check
        run: |
          mypy idss_agent/ --ignore-missing-imports --no-error-summary || true
